name: Windows RDP - 6 Jam

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: "Versi Windows Server"
        required: true
        default: "windows-2022"
        type: choice
        options:
          - windows-2025
          - windows-2022
          - windows-2019
      rdp_user:
        description: "Username RDP"
        required: true
        default: "dezels"
        type: string
      rdp_pass:
        description: "Password RDP"
        required: true
        default: "123Dezel"
        type: string
      ts_hostname:
        description: "Hostname di Tailscale"
        required: true
        default: "dezwindows"
        type: string

jobs:
  rdp:
    runs-on: ${{ inputs.windows_version }}
    timeout-minutes: 360   # Maksimal runner GitHub = 6 jam

    env:
      RDP_USER: ${{ inputs.rdp_user }}
      RDP_PASS: ${{ inputs.rdp_pass }}
      TS_HOSTNAME: ${{ inputs.ts_hostname }}

    steps:

      - name: 📥 Install Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale.exe"
          Start-Process ".\tailscale.exe" -ArgumentList "/S" -Wait

      - name: 🔌 Connect Tailscale
        shell: powershell
        env:
          TS_KEY: ${{ secrets.TS_KEY }}
        run: |
          $ts = @(
            "C:\Program Files\Tailscale\tailscale.exe",
            "C:\Program Files (x86)\Tailscale\tailscale.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $ts) { Write-Host "Tailscale not found!"; exit 1 }

          & "$ts" up --authkey "$env:TS_KEY" --hostname "$env:TS_HOSTNAME" --accept-dns --accept-routes
          if ($LASTEXITCODE -ne 0) { Write-Host "Tailscale up gagal!"; exit 1 }

          # Simpan path buat step berikutnya
          "TS_EXE=$ts" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 🛡 Create RDP User
        shell: powershell
        run: |
          $password = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $password -PasswordNeverExpires -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER

      - name: 🖥 Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      - name: 🚀 Performance Tweak
        shell: powershell
        run: |
          # Catatan: runner GitHub nggak punya GPU, ini cuma tuning prioritas CPU/multimedia
          $base = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile"
          Set-ItemProperty -Path $base -Name "SystemResponsiveness" -Value 0 -Type DWord
          $games = "$base\Tasks\Games"
          if (-not (Test-Path $games)) { New-Item -Path $games -Force | Out-Null }
          Set-ItemProperty -Path $games -Name "GPU Priority" -Value 8 -Type DWord
          Set-ItemProperty -Path $games -Name "Priority" -Value 6 -Type DWord

      - name: 🔐 RDP Info
        shell: powershell
        run: |
          $ip = (& "$env:TS_EXE" ip -4 | Select-Object -First 1)
          Write-Output "======================================"
          Write-Output " RDP INFORMATION"
          Write-Output "--------------------------------------"
          Write-Output " IP       : $ip"
          Write-Output " HOST     : $env:TS_HOSTNAME"
          Write-Output " USERNAME : $env:RDP_USER"
          Write-Output " PASSWORD : $env:RDP_PASS"
          Write-Output "======================================"

      - name: 🟢 Keep Alive
        shell: powershell
        run: |
          powercfg -change -standby-timeout-ac 0
          powercfg -change -monitor-timeout-ac 0
          powercfg -change -disk-timeout-ac 0
          Write-Host "Running sampai timeout (6 jam)..."
          while ($true) { Write-Output "alive $(Get-Date -Format 'HH:mm:ss')"; Start-Sleep -Seconds 30 }
