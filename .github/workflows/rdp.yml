name: Windows Server 2022 RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Rename Computer
        shell: powershell
        run: |
          Rename-Computer -NewName "zelsdev" -Force

      - name: Create User
        shell: powershell
        run: |
         net user dzeel oneonlydzeel /add
         net localgroup Administrators dzeel /add
         net localgroup "Remote Desktop Users" dzeel /add

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Install Tailscale
        shell: powershell
        run: |
          winget install Tailscale.Tailscale --silent --accept-package-agreements --accept-source-agreements

      - name: Connect Tailscale
        shell: powershell
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (!(Test-Path $ts)) {
              $ts = "C:\Program Files (x86)\Tailscale\tailscale.exe"
          }

          & "$ts" down
          & "$ts" up `
            --reset `
            --authkey "${{ secrets.TS_KEY }}" `
            --hostname "zelsdev" `
            --accept-dns `
            --accept-routes

      - name: Show Tailscale IP
        shell: powershell
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (!(Test-Path $ts)) {
              $ts = "C:\Program Files (x86)\Tailscale\tailscale.exe"
          }

          & "$ts" ip

      - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
